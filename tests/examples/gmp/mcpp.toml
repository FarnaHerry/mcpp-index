# compat.gmp — the DEFAULT (C API) build, on all three platforms.
#
# Not cfg-gated any more: compat.gmp no longer drives an autotools build
# through an install() hook, it is described in `mcpp = { }` and compiled by
# mcpp itself, so windows is a target like the others and a no-op main() there
# would only hide that.
#
# The C++ bindings are the `gmpxx` feature and live in tests/examples/gmp-gmpxx:
# features are resolved per consuming project, so one project cannot hold
# compat.gmp both with and without them — and this member has to keep asserting
# the build almost every consumer takes.
#
# It inherits the workspace-root `compat` redirect, so the descriptor in THIS
# checkout is what gets built and linked.
[package]
name    = "gmp-tests"
version = "0.1.0"

[dependencies.compat]
gmp = "6.3.0"
